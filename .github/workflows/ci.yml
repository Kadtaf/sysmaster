name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sysmaster
          POSTGRES_PASSWORD: sysmaster
          POSTGRES_DB: sysmaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sysmaster" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sysmaster:sysmaster@localhost:5432/sysmaster
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Keycloak (royaume importé) pour les tests d'authentification
        run: |
          docker run -d --name keycloak -p 8080:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin -e KC_HEALTH_ENABLED=true \
            -v "$PWD/infra/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
      - run: pnpm install --frozen-lockfile
      - name: Migrations et données de démo (vérifie aussi qu'elles sont rejouables)
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Attendre Keycloak
        run: timeout 180 bash -c 'until curl -sf http://localhost:9000/health/ready; do sleep 3; done' || (docker logs keycloak | tail -50; exit 1)
      - run: pnpm test
        env:
          KEYCLOAK_E2E_URL: http://localhost:8080
      - run: pnpm build

  docker:
    name: Images Docker
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
