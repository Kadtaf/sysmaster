# Valeurs par défaut, prudentes. Un environnement les surcharge (voir values-staging.yaml).
# Postgres et Keycloak ne sont PAS installés par ce chart : en test comme en production, on
# utilise des services gérés ou des charts dédiés, sauvegardés indépendamment de l'application.

image:
  registry: ghcr.io/kadtaf
  tag: ""            # vide : appVersion du chart. La CD passe le SHA du commit.
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Secret Kubernetes existant (jamais dans Git) contenant :
#   DATABASE_URL, NEXTAUTH_SECRET, KEYCLOAK_CLIENT_SECRET,
#   AI_SERVICE_TOKEN (si ai.enabled), ANTHROPIC_API_KEY (si ai.llm=claude),
#   CERT_SIGNING_KEY (clé Ed25519 PEM des certificats ; sans elle, aucun examen n'est ouvert),
#   KEYCLOAK_ADMIN_CLIENT_ID / KEYCLOAK_ADMIN_CLIENT_SECRET (facultatifs : suppression Keycloak des comptes effacés)
existingSecret: sysmaster-secrets

publicUrl: https://sysmaster.example.com   # URL vue par le navigateur (front et API sur le même hôte)

oidc:
  issuer: https://auth.example.com/realms/sysmaster   # vu par le navigateur et inscrit dans les jetons
  internalIssuer: ""                                  # facultatif : même royaume joint par le réseau interne
  audience: sysmaster-api
  webClientId: sysmaster-web

api:
  replicas: 2
  port: 4000
  metricsPort: 9464
  logFormat: json
  outboxRelayIntervalMs: 1000
  extraEnv: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# Assistant (services/ai). Appelé seulement par l'API cœur, jamais exposé.
ai:
  enabled: true
  replicas: 2
  llm: claude            # « fake » : réponses factices, sans clé ni coût (démonstration)
  model: claude-opus-5-5
  effort: medium
  assistantDailyQuota: 30
  timeoutMs: 90000
  # Documentation officielle (RAG). Qdrant n'est pas installé par ce chart (comme Postgres) :
  # vide, l'assistant ne s'appuie que sur les fiches SysMaster.
  qdrantUrl: ""
  # Collecte hebdomadaire de la documentation officielle (exige qdrantUrl et un accès Internet sortant).
  ingest:
    enabled: false
    schedule: "17 3 * * 0"   # dimanche 3 h 17 : hors trafic, minute non ronde pour ne pas charger les sites cités
    maxPagesPerSource: 400
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
  networkPolicy:
    enabled: true
  extraEnv: {}
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

web:
  replicas: 2
  port: 3000
  extraEnv: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

migrations:
  enabled: true
  # Données de démo : utile en test, jamais en production (le script refuse --reset en production, pas --seed).
  seed: false
  backoffLimit: 1
  activeDeadlineSeconds: 600

ingress:
  enabled: true
  className: nginx
  host: sysmaster.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: sysmaster-tls

podDisruptionBudget:
  enabled: true
  minAvailable: 1

monitoring:
  # Nécessitent les CRD du Prometheus Operator (kube-prometheus-stack).
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
