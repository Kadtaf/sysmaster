{{- $name := printf "%s-api" (include "sysmaster.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sysmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "sysmaster.selector" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "sysmaster.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # Laisse le relais outbox finir son lot avant l'arrêt (enableShutdownHooks).
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/sysmaster-api:{{ include "sysmaster.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sysmaster.containerSecurity" . | nindent 10 }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
            - { name: metrics, containerPort: {{ .Values.api.metricsPort }} }
          env:
            {{- include "sysmaster.apiEnv" . | nindent 12 }}
            - { name: API_PORT, value: {{ .Values.api.port | quote }} }
            - { name: METRICS_PORT, value: {{ .Values.api.metricsPort | quote }} }
            - { name: LOG_FORMAT, value: {{ .Values.api.logFormat | quote }} }
            - { name: OUTBOX_RELAY_INTERVAL_MS, value: {{ .Values.api.outboxRelayIntervalMs | quote }} }
            - { name: CORS_ORIGINS, value: {{ .Values.publicUrl | quote }} }
            - { name: OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }} }
            - { name: OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }} }
            {{- with .Values.oidc.internalIssuer }}
            - { name: OIDC_JWKS_URL, value: {{ printf "%s/protocol/openid-connect/certs" . | quote }} }
            {{- end }}
            {{- if .Values.ai.enabled }}
            - { name: AI_SERVICE_URL, value: {{ printf "http://%s-ai" (include "sysmaster.fullname" .) | quote }} }
            - { name: AI_SERVICE_TIMEOUT_MS, value: {{ .Values.ai.timeoutMs | quote }} }
            - { name: ASSISTANT_DAILY_QUOTA, value: {{ .Values.ai.assistantDailyQuota | quote }} }
            - name: AI_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: AI_SERVICE_TOKEN } }
            {{- end }}
            # Clé Ed25519 des certificats (facultative : sans elle, aucun examen n'est ouvert).
            - name: CERT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: CERT_SIGNING_KEY, optional: true } }
            # Paiement Stripe (facultatif : sans les deux secrets, les offres s'affichent sans pouvoir être payées).
            - { name: PUBLIC_WEB_URL, value: {{ .Values.publicUrl | quote }} }
            - { name: STRIPE_PRICES, value: {{ .Values.billing.prices | default "" | quote }} }
            - { name: STRIPE_AUTOMATIC_TAX, value: {{ .Values.billing.automaticTax | default false | quote }} }
            - name: STRIPE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: STRIPE_SECRET_KEY, optional: true } }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: STRIPE_WEBHOOK_SECRET, optional: true } }
            {{- range $k, $v := .Values.api.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sysmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "sysmaster.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: {{ .Values.api.metricsPort }}, targetPort: metrics }
