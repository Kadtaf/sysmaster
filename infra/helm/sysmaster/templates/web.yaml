{{- $name := printf "%s-web" (include "sysmaster.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sysmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "sysmaster.selector" (dict "root" . "component" "web") | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "sysmaster.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/sysmaster-web:{{ include "sysmaster.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sysmaster.containerSecurity" . | nindent 10 }}
          ports:
            - { name: http, containerPort: {{ .Values.web.port }} }
          env:
            - { name: APP_VERSION, value: {{ include "sysmaster.tag" . | quote }} }
            - { name: PORT, value: {{ .Values.web.port | quote }} }
            # Le serveur Next.js appelle l'API par le réseau interne du cluster.
            - { name: API_URL_INTERNAL, value: "http://{{ include "sysmaster.fullname" . }}-api/api/v1" }
            - { name: NEXTAUTH_URL, value: {{ .Values.publicUrl | quote }} }
            - { name: KEYCLOAK_ISSUER, value: {{ .Values.oidc.issuer | quote }} }
            {{- with .Values.oidc.internalIssuer }}
            - { name: KEYCLOAK_INTERNAL_ISSUER, value: {{ . | quote }} }
            {{- end }}
            - { name: KEYCLOAK_CLIENT_ID, value: {{ .Values.oidc.webClientId | quote }} }
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: NEXTAUTH_SECRET } }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: KEYCLOAK_CLIENT_SECRET } }
            {{- range $k, $v := .Values.web.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # Cache d'images et de pages de Next.js : seul endroit où le serveur écrit.
            - { name: cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sysmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "sysmaster.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
