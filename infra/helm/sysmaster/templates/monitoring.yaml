{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sysmaster.fullname" . }}-api
  labels:
    {{- include "sysmaster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sysmaster.selector" (dict "root" . "component" "api") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
# Chaque alerte dit ce qu'elle signifie et quoi regarder en premier (runbook dans docs/08 §7).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sysmaster.fullname" . }}
  labels:
    {{- include "sysmaster.labels" . | nindent 4 }}
spec:
  groups:
    - name: sysmaster.rules
      rules:
        - alert: SysmasterApiErreurs5xx
          expr: |
            sum(rate(http_request_duration_seconds_count{service="sysmaster-api",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_request_duration_seconds_count{service="sysmaster-api"}[5m])), 1e-9) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Plus de 5 % des requêtes de l'API échouent (5xx)
            description: Regarder les journaux de l'API (requestId) et l'état de la base (sonde ready).
        - alert: SysmasterApiLente
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="sysmaster-api",route!~".*/health.*"}[5m]))) > 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: 95 % des requêtes de l'API prennent plus d'une seconde
            description: Chercher la route la plus lente (label route) puis la requête SQL en cause (pg_stat_statements).
        - alert: SysmasterOutboxLettreMorte
          expr: max(outbox_dead_letter_events{service="sysmaster-api"}) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Des événements ont été abandonnés après 10 essais
            description: Lire last_error dans platform.outbox_events, corriger le consommateur, puis remettre attempts à 0.
        - alert: SysmasterOutboxEnRetard
          expr: max(outbox_oldest_pending_seconds{service="sysmaster-api"}) > 300
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Un événement attend depuis plus de 5 minutes
            description: Le relais est arrêté ou un consommateur échoue en boucle ; voir les journaux « OutboxRelay ».
        - alert: SysmasterApiIndisponible
          expr: sum(kube_deployment_status_replicas_available{deployment="{{ include "sysmaster.fullname" . }}-api"}) < 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: Aucun pod de l'API n'est prêt
            description: La sonde ready échoue généralement quand la base est injoignable (vérifier DATABASE_URL et Postgres).
{{- end }}
