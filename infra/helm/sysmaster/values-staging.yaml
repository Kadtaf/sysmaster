# Environnement de test. L'hôte et l'émetteur OIDC sont passés par la CD (--set) depuis
# les variables de l'environnement GitHub « staging ».
api:
  replicas: 1
  extraEnv:
    # Plus bavard en test pour comprendre un comportement inattendu.
    NODE_OPTIONS: "--enable-source-maps"
ai:
  replicas: 1
  # Sans clé d'API en test, l'assistant reste utilisable en mode factice. Passer à « claude »
  # (et ajouter ANTHROPIC_API_KEY au secret) pour tester le vrai modèle.
  llm: fake
web:
  replicas: 1
migrations:
  seed: true
podDisruptionBudget:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
