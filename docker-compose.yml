# Pile de développement complète : docker compose up --build
# Web : http://localhost:3000   API : http://localhost:4000/api/v1   Swagger : http://localhost:4000/api/docs
# Keycloak : http://localhost:8080/admin
name: sysmaster

x-db-env: &db-env
  DATABASE_URL: postgres://${POSTGRES_USER:-sysmaster}:${POSTGRES_PASSWORD:-sysmaster}@postgres:5432/${POSTGRES_DB:-sysmaster}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sysmaster}
      POSTGRES_DB: ${POSTGRES_DB:-sysmaster}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crée la base « keycloak » au premier démarrage du volume
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    # Base vectorielle du RAG (utilisée à partir de la Phase 3)
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  keycloak:
    # Identité : e-mail, fournisseurs sociaux, 2FA, passkeys, rôles (ADR-008, docs/06-authentification.md).
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-sysmaster}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sysmaster}
      # Émetteur fixe (celui que voit le navigateur) ; les appels serveur passent par http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      SYSMASTER_WEB_URL: http://localhost:3000
      SYSMASTER_WEB_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-only-web-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-a-configurer}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-a-configurer}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-a-configurer}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-a-configurer}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-a-configurer}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-a-configurer}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # L'image ne contient pas curl : requête HTTP brute sur le port de gestion.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
      start_period: 30s

  migrate:
    # Applique les migrations puis charge les données de démonstration, et s'arrête.
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    working_dir: /repo
    command: ["node", "infra/scripts/migrate.mjs", "--seed"]
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      OIDC_ISSUER: http://localhost:8080/realms/sysmaster
      OIDC_JWKS_URL: http://keycloak:8080/realms/sysmaster/protocol/openid-connect/certs
      OIDC_AUDIENCE: sysmaster-api
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-token}
      ASSISTANT_DAILY_QUOTA: ${ASSISTANT_DAILY_QUOTA:-30}
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  ai:
    # Assistant (FastAPI). Sans clé, AI_LLM=fake renvoie des réponses factices mais structurées :
    # toute la chaîne (routage, RAG, garde-fous, interface) fonctionne sans coût.
    build: { context: ., dockerfile: infra/docker/ai.Dockerfile }
    environment:
      AI_LLM: ${AI_LLM:-fake}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-token}
      CORE_API_URL: http://api:4000/api/v1
    # Pas de port publié : seul l'API cœur l'appelle.

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    environment:
      API_URL_INTERNAL: http://api:4000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-only-change-me-dev-only-change-me}
      KEYCLOAK_ISSUER: http://localhost:8080/realms/sysmaster
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/sysmaster
      KEYCLOAK_CLIENT_ID: sysmaster-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-only-web-secret}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  qdrantdata:
